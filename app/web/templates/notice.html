<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b6c">
<title>{{ TITLE }}</title>
<link rel="stylesheet" href="/static/chat.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<style>
  .notice { padding: 28px 20px; }
  .notice h1 { font-size: 24px; margin: 0 0 10px; letter-spacing: -.02em; }
  .notice p { color: var(--ink-soft); margin: 0 0 20px; }
  .btn {
    display: inline-block; background: var(--brand); color: #fff;
    border: 0; border-radius: 999px; padding: 12px 22px;
    font-size: 15px; font-weight: 700; text-decoration: none;
    font-family: var(--font); cursor: pointer;
  }
  .notice form { display: flex; gap: 8px; flex-wrap: wrap; }
  .notice input[type=date] {
    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 11px 16px; font-size: 16px; font-family: var(--font);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">● Group buying</div>
    <h1>Buy Together. Pay Less.</h1>
  </header>
  <div class="notice">
    <h1>{{ TITLE }}</h1>
    <p>{{ BODY }}</p>
    {{ ACTION }}
  </div>
</div>
</body>
</html>
