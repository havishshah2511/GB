<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008069">
<title>Buy Together. Pay Less.</title>
<link rel="stylesheet" href="/static/chat.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">🛒</div>
    <div class="who">
      <h1>Buy Together. Pay Less.</h1>
      <p class="presence" id="presence">online</p>
    </div>
  </header>
  {{ INVITE_BANNER }}
  <div class="progress" id="progress"></div>

  <div id="log" role="log" aria-live="polite"></div>

  <div class="composer">
    <div class="chips" id="chips"></div>
    <form class="inputrow" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type a message" autocomplete="off"
             enterkeyhint="send" aria-label="Message">
      <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
  </div>
  <footer class="legal">Group prices are indicative until a supplier quote is confirmed.</footer>
</div>

<script>
  window.GB = { ref: "{{ REF }}", group: "{{ GROUP }}" };
</script>
<script src="/static/chat.js"></script>
</body>
</html>
